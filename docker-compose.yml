# AeroCRM — arranque completo con un solo comando (TS-004).
#
#   1. cp backend/.env.example backend/.env   y completa los valores (ver README)
#   2. docker compose up -d --build
#
# Frontend: http://localhost:8100 · API: http://localhost:3100/api · Swagger: http://localhost:3100/api/docs
# Usa la base compartida de Supabase definida en backend/.env.
# Para trabajar con una base local en contenedor, ver docker-compose.local.yml.
# Ninguna clave se escribe en este archivo (AGENTS.md D4).

services:
  backend:
    build:
      context: ./backend
    container_name: aerocrm-backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      NODE_ENV: production
      PORT: "3000"
    ports:
      - "3100:3000"
    healthcheck:
      # Falla si la base no responde: /api/health hace SELECT 1.
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
    container_name: aerocrm-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8100:80"
