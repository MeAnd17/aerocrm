services:

  # ── PostgreSQL ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: viajes-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: viajes_user
      POSTGRES_PASSWORD: viajes_pass
      POSTGRES_DB: viajes_crm
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U viajes_user -d viajes_crm"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - viajes-net

  # ── NestJS Backend ───────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: viajes-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://viajes_user:viajes_pass@postgres:5432/viajes_crm"
      JWT_SECRET: "viajes-crm-jwt-secret-change-in-production-2026"
      JWT_EXPIRES_IN: "24h"
      CALENDARIFIC_API_KEY: "${CALENDARIFIC_API_KEY:-your-calendarific-key}"
      OPENWEATHER_API_KEY: "${OPENWEATHER_API_KEY:-your-openweather-key}"
      NODE_ENV: "production"
      PORT: "3000"
    ports:
      - "3100:3000"
    networks:
      - viajes-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Angular Frontend (nginx) ─────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: viajes-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8100:80"
    networks:
      - viajes-net

volumes:
  postgres_data:

networks:
  viajes-net:
    driver: bridge
